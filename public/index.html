<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Court Tonight?</title>
<meta name="description" content="Find an open public tennis court near West Hollywood tonight.">
<meta name="theme-color" content="#2456A4">

<!-- Link previews (iMessage, Slack, social) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Court Tonight">
<meta property="og:title" content="Court Tonight?">
<meta property="og:description" content="Find an open public tennis court near West Hollywood tonight.">
<meta property="og:url" content="https://weho-court-tonte.netlify.app/">
<meta property="og:image" content="https://weho-court-tonte.netlify.app/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Court Tonight — two bouncing tennis balls on a court-blue background">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Court Tonight?">
<meta name="twitter:description" content="Find an open public tennis court near West Hollywood tonight.">
<meta name="twitter:image" content="https://weho-court-tonte.netlify.app/brand/og.png">

<!-- Icons -->
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Court Tonight">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #2456A4;      /* hard-court blue */
    --court-deep: #1B4384;
    --line: #F6F4EE;       /* chalk */
    --line-dim: rgba(246,244,238,.55);
    --ball: #DCEB3A;       /* optic yellow */
    --ink: #0F2447;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --court: #1B4384; --court-deep: #12305F; }
  }
  :root[data-theme="dark"] { --court: #1B4384; --court-deep: #12305F; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--court);
    color: var(--line);
    font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    padding: clamp(20px, 5vw, 56px);
    /* Home-screen mode runs under the iPhone status bar: leave room for it. */
    padding-top: calc(clamp(20px, 5vw, 56px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(clamp(20px, 5vw, 56px) + env(safe-area-inset-bottom, 0px));
    line-height: 1.35;
  }

  /* ---------- logo ---------- */
  .logo { display: inline-flex; align-items: center; gap: .08em; font-weight: 700; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .logo svg { height: .92em; width: .92em; flex: none; margin: 0 .02em; }
  .logo .sp { width: .3em; }

  /* ---------- splash ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 10;
    background: var(--court);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px 24px; text-align: center;
  }
  #splash.hide { animation: splash-out .45s ease-in forwards; }
  @keyframes splash-out { to { opacity: 0; transform: translateY(-6%); visibility: hidden; } }

  .dice { display: flex; gap: clamp(18px, 6vw, 36px); align-items: flex-end; height: clamp(150px, 34vw, 220px); }
  .die { width: clamp(84px, 22vw, 120px); height: clamp(84px, 22vw, 120px); position: relative; transform-origin: 50% 100%; animation: bounce 1.1s cubic-bezier(.3,0,.2,1) infinite; }
  .die:nth-child(2) { animation-delay: .32s; }
  .die svg { width: 100%; height: 100%; display: block; animation: spin 1.1s linear infinite; }
  .die:nth-child(2) svg { animation-direction: reverse; }
  @keyframes bounce {
    0%   { transform: translateY(0) scale(1.18, .82); }
    18%  { transform: translateY(-16%) scale(.94, 1.08); }
    50%  { transform: translateY(-115%) scale(1, 1); }
    82%  { transform: translateY(-16%) scale(.98, 1.04); }
    100% { transform: translateY(0) scale(1.18, .82); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shadow { position: absolute; left: 8%; right: 8%; bottom: -10px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.35); animation: shadow 1.1s cubic-bezier(.3,0,.2,1) infinite; }
  .die:nth-child(2) .shadow { animation-delay: .32s; }
  @keyframes shadow { 0%,100% { transform: scale(1.1); opacity: .5; } 50% { transform: scale(.5); opacity: .15; } }

  .splash-title { font-size: clamp(44px, 12vw, 120px); font-weight: 700; letter-spacing: -.03em; line-height: .95; text-transform: uppercase; margin: 0; }
  .splash-title .w { display: block; }
  .splash-title .ch { display: inline-block; opacity: 0; transform: translateY(.6em) rotate(-12deg) scale(.6); animation: pop .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  .splash-title .ch.o { color: var(--ball); }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .splash-sub { margin: 0; color: var(--line-dim); font-size: 1.05rem; opacity: 0; animation: pop .5s .9s ease forwards; }

  @media (prefers-reduced-motion: reduce) {
    .die, .die svg, .shadow { animation: none; }
    .splash-title .ch, .splash-sub { animation: none; opacity: 1; transform: none; }
    #splash.hide { animation: none; display: none; }
  }

  /* ---------- main ---------- */
  main { max-width: 640px; margin: 0 auto; border: 3px solid var(--line); }
  header { padding: 18px 22px 0; }
  header .logo { font-size: 1.35rem; }
  .q { margin: 8px 0 0; font-size: 1.05rem; font-weight: 400; color: var(--line-dim); }
  .answer {
    margin: 0; padding: 4px 22px 18px;
    font-size: clamp(88px, 28vw, 170px); font-weight: 700; line-height: .9; letter-spacing: -.03em;
    border-bottom: 3px solid var(--line);
  }
  .answer.yes { color: var(--ball); }
  .answer.wait { color: var(--line-dim); }

  .daybar { padding: 14px 22px; border-bottom: 3px solid var(--line); }
  .btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: .4em; transition: transform .08s ease; }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
  .daybar { display: grid; gap: 10px; }
  .btn-day { width: 100%; padding: 16px 22px; font-size: 1.2rem; background: var(--line); color: var(--ink); border: 3px solid var(--line); }
  .btn-day:hover { background: var(--ball); border-color: var(--ball); }
  .btn-mode { width: 100%; padding: 12px 22px; font-size: 1.05rem; background: transparent; color: var(--line); border: 2px solid var(--line-dim); }
  .btn-mode:hover { border-color: var(--line); }
  .btn-mode.on { background: var(--ball); color: var(--ink); border-color: var(--ball); }
  .btn-book { padding: 8px 16px; font-size: .95rem; background: transparent; color: var(--line); border: 2px solid var(--line); }
  .btn-book:hover { background: var(--line); color: var(--ink); }

  .site { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 16px 22px; border-bottom: 3px solid var(--line); align-items: center; }
  .site:last-of-type { border-bottom: 0; }
  .site h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .site h2 small { display: block; font-size: .85rem; font-weight: 400; color: var(--line-dim); margin-top: 2px; }
  .slots { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
  .slots a { background: var(--ball); color: var(--ink); font-weight: 600; padding: 8px 14px; border-radius: 999px; font-size: .95rem; text-decoration: none; display: inline-block; transition: transform .08s ease, background .15s; }
  .slots a:hover { background: var(--line); }
  .slots a:active { transform: scale(.96); }
  .slots a:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }
  .slots a small { font-weight: 400; margin-left: 5px; }
  .none, .err { grid-column: 1 / -1; margin: 0; color: var(--line-dim); }
  .err { color: #FFC9C9; }
  footer { max-width: 640px; margin: 14px auto 0; color: var(--line-dim); font-size: .9rem; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  footer button { background: none; border: 1.5px solid var(--line-dim); color: var(--line); font: inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  footer button:focus-visible { outline: 2px solid var(--ball); }
  footer .note { flex-basis: 100%; font-size: .8rem; }

  /* ---------- add-to-home-screen banner ---------- */
  #a2hs { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 9;
    background: var(--line); color: var(--ink); border-radius: 18px; padding: 14px 16px; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: 560px; margin: 0 auto; }
  #a2hs.show { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
  #a2hs img { width: 44px; height: 44px; border-radius: 10px; }
  #a2hs strong { display: block; font-size: 1rem; }
  #a2hs p { margin: 2px 0 0; font-size: .9rem; line-height: 1.3; }
  #a2hs .share { display: inline-block; width: 1em; height: 1em; vertical-align: -.12em; }
  #a2hs .x { background: none; border: 0; font: inherit; font-size: 1.4rem; line-height: 1; color: var(--ink); cursor: pointer; padding: 6px; }
  #a2hs .install { font: inherit; font-weight: 700; background: var(--court); color: var(--line); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tennis-ball" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="var(--ball)"/>
      <path d="M22 8c18 22 18 62 0 84M78 8c-18 22-18 62 0 84" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="die-a" viewBox="0 0 100 100">
      <use href="#tennis-ball"/>
      <circle cx="50" cy="50" r="7" fill="var(--ink)"/>
    </symbol>
    <symbol id="die-b" viewBox="0 0 100 100">
      <use href="#tennis-ball"/>
      <circle cx="38" cy="38" r="6.5" fill="var(--ink)"/><circle cx="62" cy="62" r="6.5" fill="var(--ink)"/>
      <circle cx="62" cy="38" r="6.5" fill="var(--ink)"/><circle cx="38" cy="62" r="6.5" fill="var(--ink)"/>
    </symbol>
  </defs>
</svg>

<div id="splash" role="status" aria-label="Checking courts">
  <div class="dice" aria-hidden="true">
    <div class="die"><svg><use href="#die-a"/></svg><div class="shadow"></div></div>
    <div class="die"><svg><use href="#die-b"/></svg><div class="shadow"></div></div>
  </div>
  <h1 class="splash-title" id="splash-title" aria-label="Court Tonight"></h1>
  <p class="splash-sub">Rolling the dice on six parks…</p>
</div>

<main id="app"></main>
<footer id="meta"></footer>

<div id="a2hs" role="dialog" aria-label="Add to Home Screen">
  <img src="/brand/apple-touch-icon.png" alt="">
  <div>
    <strong>Put this on your Home Screen</strong>
    <p id="a2hs-how">Tap <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> Share, then <b>Add to Home Screen</b>. Opens like an app.</p>
  </div>
  <button class="x" id="a2hs-close" aria-label="Dismiss">×</button>
</div>

<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app = document.getElementById('app'), meta = document.getElementById('meta'), splash = document.getElementById('splash');
  const BALL = `<svg aria-hidden="true"><use href="#tennis-ball"/></svg>`;
  const LOGO = `<span class="logo" aria-label="Court Tonight">C${BALL}URT<span class="sp"></span>T${BALL}NIGHT</span>`;

  // Splash title: letters pop in one at a time; the O's are tennis-ball yellow.
  (function buildTitle() {
    const t = document.getElementById('splash-title');
    let i = 0;
    t.innerHTML = ['COURT', 'TONIGHT'].map(w => `<span class="w">${[...w].map(ch =>
      `<span class="ch${ch === 'O' ? ' o' : ''}" style="animation-delay:${.15 + (i++) * .06}s">${ch}</span>`).join('')}</span>`).join('');
  })();
  const splashShownAt = Date.now();
  function hideSplash() {
    if (!document.body.contains(splash)) return;
    const wait = Math.max(0, 1800 - (Date.now() - splashShownAt));  // let the animation land
    setTimeout(() => { splash.classList.add('hide'); setTimeout(() => splash.remove(), 500); }, wait);
  }

  let day = 'today';
  let mode = null; // null = let the server pick (weekday evenings, weekends all day)

  const siteHtml = s => `
    <section class="site">
      <h2>${esc(s.name)}${s.miles != null ? `<small>${esc(s.miles)} mi</small>` : ''}</h2>
      <a class="btn btn-book" href="${esc(s.url)}" target="_blank" rel="noopener">Book</a>
      ${s.error ? `<p class="err">Couldn't check this park. ${esc(s.error)}</p>`
        : s.slots.length
          ? `<ul class="slots">${s.slots.map(x =>
              `<li><a href="${esc(x.url || s.url)}" target="_blank" rel="noopener">${esc(x.time)}${x.court ? `<small>${esc(x.court)}</small>` : ''}</a></li>`).join('')}</ul>`
          : `<p class="none">Nothing open.</p>`}
    </section>`;

  function frame(inner, sub) {
    app.innerHTML = `<header>${LOGO}<p class="q">${sub}</p></header>${inner}`;
  }

  function showLoading() {
    frame(`<h1 class="answer wait">…</h1>
      <section class="site"><p class="none">Checking six parks. Takes a few seconds.</p></section>`,
      `Court free ${day === 'today' ? 'tonight' : 'tomorrow'}?`);
    meta.innerHTML = '';
  }

  function render(data) {
    const total = data.sites.reduce((n, s) => n + s.slots.length, 0);
    // Parks with an open court first, then closest to West Hollywood.
    const sites = [...data.sites].sort((a, b) => (b.slots.length > 0) - (a.slots.length > 0) || (a.miles ?? 99) - (b.miles ?? 99));
    const showingTomorrow = data.which_day === 'tomorrow';
    const allDay = data.mode === 'all';
    const when = showingTomorrow ? (allDay ? 'tomorrow' : 'tomorrow evening') : (allDay ? 'today' : 'tonight');
    const dayBtn = data.auto_tomorrow
      ? `<p class="none">Today's courts are done, so this is tomorrow.</p>`
      : `<button class="btn btn-day" id="daybtn">${showingTomorrow ? '← Back to today' : 'Check tomorrow instead →'}</button>`;
    const modeBtn = data.weekend
      ? `<p class="none">Weekend: showing the whole day.</p>`
      : `<button class="btn btn-mode${allDay ? ' on' : ''}" id="modebtn">${allDay ? '✓ Showing all day — evenings only' : 'Show all day'}</button>`;
    frame(`
      <h1 class="answer ${total ? 'yes' : 'no'}">${total ? 'Yes' : 'No'}</h1>
      <div class="daybar">${dayBtn}${modeBtn}</div>
      ${sites.map(siteHtml).join('')}`,
      `Court free ${esc(when)}, ${esc(data.date)}?`);
    meta.innerHTML = `<span>Checked ${esc(data.checked_at)} · ${esc(data.window)}</span>
      <button id="again">Check again</button>
      <span class="note">Miles are rough driving distance from West Hollywood.</span>`;
    document.getElementById('again').onclick = () => load();
    const b = document.getElementById('daybtn');
    if (b) b.onclick = () => { day = showingTomorrow ? 'today' : 'tomorrow'; load(); };
    const m = document.getElementById('modebtn');
    if (m) m.onclick = () => { mode = allDay ? 'evening' : 'all'; load(); };
  }

  async function load() {
    showLoading();
    try {
      const q = new URLSearchParams();
      if (day === 'tomorrow') q.set('day', 'tomorrow');
      if (mode) q.set('mode', mode);
      const r = await fetch('/api/courts' + (q.toString() ? '?' + q : ''), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    } catch (e) {
      frame(`<h1 class="answer no">?</h1>
        <section class="site"><p class="err">The check didn't run (${esc(e.message)}). Try again in a minute.</p></section>`,
        `Court free ${day === 'today' ? 'tonight' : 'tomorrow'}?`);
      meta.innerHTML = `<span></span><button id="again">Try again</button>`;
      document.getElementById('again').onclick = () => load();
    } finally {
      hideSplash();
    }
  }
  load();

  // ---------- Add to Home Screen ----------
  // Shown once, after the splash, only when not already installed. Dismissing it is remembered on this device.
  (function a2hs() {
    const el = document.getElementById('a2hs');
    const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    let dismissed = false;
    try { dismissed = localStorage.getItem('a2hs-dismissed') === '1'; } catch (e) {}
    if (installed || dismissed) return;
    const dismiss = () => { el.classList.remove('show'); try { localStorage.setItem('a2hs-dismissed', '1'); } catch (e) {} };
    document.getElementById('a2hs-close').onclick = dismiss;

    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    let deferred = null;
    window.addEventListener('beforeinstallprompt', e => {  // Android / Chrome: real install button
      e.preventDefault(); deferred = e;
      document.getElementById('a2hs-how').innerHTML = 'One tap and it opens like an app.';
      const btn = document.createElement('button'); btn.className = 'install'; btn.textContent = 'Install';
      btn.onclick = async () => { deferred.prompt(); await deferred.userChoice; dismiss(); };
      document.getElementById('a2hs-close').replaceWith(btn);
      setTimeout(() => el.classList.add('show'), 2600);
    });
    if (isIOS) {
      if (!isSafari) document.getElementById('a2hs-how').innerHTML = 'Open this link in <b>Safari</b>, tap Share, then <b>Add to Home Screen</b>.';
      setTimeout(() => el.classList.add('show'), 2600);
    }
    window.addEventListener('appinstalled', dismiss);
  })();
</script>
</body>
</html>
