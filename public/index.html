<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court tonight?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #2456A4;      /* hard-court blue */
    --court-deep: #1B4384;
    --line: #F6F4EE;       /* chalk */
    --line-dim: rgba(246,244,238,.55);
    --ball: #DCEB3A;       /* optic yellow */
    --ink: #0F2447;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --court: #1B4384; --court-deep: #12305F; }
  }
  :root[data-theme="dark"] { --court: #1B4384; --court-deep: #12305F; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--court);
    color: var(--line);
    font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    padding: clamp(20px, 5vw, 56px);
    line-height: 1.35;
  }
  main { max-width: 640px; margin: 0 auto; border: 3px solid var(--line); }
  header { padding: 20px 22px 0; }
  .q { margin: 0; font-size: 1.05rem; font-weight: 400; color: var(--line-dim); }
  .answer {
    margin: 0; padding: 4px 22px 18px;
    font-size: clamp(88px, 28vw, 170px); font-weight: 700; line-height: .9; letter-spacing: -.03em;
    border-bottom: 3px solid var(--line);
  }
  .answer.yes { color: var(--ball); }
  .answer.wait { color: var(--line-dim); }
  .site { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; padding: 16px 22px; border-bottom: 3px solid var(--line); align-items: start; }
  .site:last-of-type { border-bottom: 0; }
  .site h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .site a.book { color: var(--line); font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .site a.book:focus-visible, .site a.book:hover { color: var(--ball); outline: none; }
  .slots { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
  .slots li { background: var(--ball); color: var(--ink); font-weight: 600; padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
  .slots li small { font-weight: 400; margin-left: 5px; }
  .none, .err { grid-column: 1 / -1; margin: 0; color: var(--line-dim); }
  .err { color: #FFC9C9; }
  footer { max-width: 640px; margin: 14px auto 0; color: var(--line-dim); font-size: .9rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer button { background: none; border: 1.5px solid var(--line-dim); color: var(--line); font: inherit; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  footer button:focus-visible { outline: 2px solid var(--ball); }
</style>
</head>
<body>
<main id="app"></main>
<footer id="meta"></footer>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app = document.getElementById('app'), meta = document.getElementById('meta');

  const siteHtml = s => `
    <section class="site">
      <h2>${esc(s.name)}</h2>
      <a class="book" href="${esc(s.url)}" target="_blank" rel="noopener">Book</a>
      ${s.error ? `<p class="err">Couldn't check this park. ${esc(s.error)}</p>`
        : s.slots.length
          ? `<ul class="slots">${s.slots.map(x => `<li>${esc(x.time)}${x.court ? `<small>${esc(x.court)}</small>` : ''}</li>`).join('')}</ul>`
          : `<p class="none">Nothing open.</p>`}
    </section>`;

  function showLoading() {
    app.innerHTML = `<header><p class="q">Court free tonight?</p></header>
      <h1 class="answer wait">…</h1>
      <section class="site"><p class="none">Checking six parks. Takes a few seconds.</p></section>`;
    meta.innerHTML = '';
  }

  function render(data) {
    const total = data.sites.reduce((n, s) => n + s.slots.length, 0);
    const sites = [...data.sites].sort((a, b) => b.slots.length - a.slots.length);
    app.innerHTML = `
      <header><p class="q">Court free ${esc(data.which_day)}, ${esc(data.date)}?</p></header>
      <h1 class="answer ${total ? 'yes' : 'no'}">${total ? 'Yes' : 'No'}</h1>
      ${sites.map(siteHtml).join('')}`;
    meta.innerHTML = `<span>Checked ${esc(data.checked_at)} · ${esc(data.window)}</span>
      <button id="again">Check again</button>`;
    document.getElementById('again').onclick = load;
  }

  async function load() {
    showLoading();
    try {
      const r = await fetch('/api/courts', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    } catch (e) {
      app.innerHTML = `<header><p class="q">Court free tonight?</p></header>
        <h1 class="answer no">?</h1>
        <section class="site"><p class="err">The check didn't run (${esc(e.message)}). Pull down to refresh, or try again in a minute.</p></section>`;
      meta.innerHTML = `<span></span><button id="again">Try again</button>`;
      document.getElementById('again').onclick = load;
    }
  }
  load();
</script>
</body>
</html>
